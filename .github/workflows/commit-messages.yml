name: Commit Messages

# Separate from ci.yml so editing a PR title reruns only this check, not the OS matrix.
on:
  pull_request:
    branches:
      - main
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A squash merge commits the PR title; a rebase merge commits each commit.
      - name: Check the PR title and every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          status=0
          sh scripts/check-commit-message.sh -m "$PR_TITLE" || status=1
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            sh scripts/check-commit-message.sh "$RUNNER_TEMP/message" || status=1
          done
          exit $status
